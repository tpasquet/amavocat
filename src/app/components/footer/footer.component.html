<footer class="footer-container" role="contentinfo">

                <span class="separator">•</span>
                <a href="tel:0769997560" aria-label="Téléphone : 07 69 99 75 60">07 69 99 75 60</a>

            <p class="footer-copyright">&copy; 2025 {{ 'footer.copyright' | translate }}</p>
