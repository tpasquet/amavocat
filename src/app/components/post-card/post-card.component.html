<div class="card" style="width: 18rem;">
    <img class="card-img-top" [src]="post.featuredImage" [alt]="post.featuredImageAlt || post.title">
    <div class="card-body">
        <h5 class="card-title">{{post.title}}</h5>
        <p class="card-text" [innerHTML]="post.description"></p>
        <button class="btn btn-primary" (click)="onReadPostClicked(post)">Lire l'article</button>
    </div>
</div>
