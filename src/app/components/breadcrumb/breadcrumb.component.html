<ng-container *ngIf="breadcrumbs$ | async as breadcrumbs">
  <nav [attr.aria-label]="'breadcrumb.label' | translate" class="breadcrumb-container" *ngIf="breadcrumbs.length > 1">
    <ol class="breadcrumb">
      <li class="breadcrumb-item" *ngFor="let crumb of breadcrumbs; let last = last" [class.active]="last">
        <a *ngIf="!last" [routerLink]="crumb.url">{{ crumb.label }}</a>
        <span *ngIf="last" aria-current="page">{{ crumb.label }}</span>
      </li>
    </ol>
  </nav>
</ng-container>
