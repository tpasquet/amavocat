<div class="navbar-container">
    <div class="navbar-link-container" *ngIf="!showBurgerMenu">
        <div class="navbar-item">
            <a class="navbar-link" (click)="redirectTo('home')">Accueil</a>
        </div>
        <div class="navbar-item">
            <a class="navbar-link" (click)="redirectTo('domains')">Domaines</a>
        </div>
        <div class="navbar-item">
            <a class="navbar-link" (click)="redirectTo('posts')">Articles</a>
        </div>
        <div class="navbar-item">
            <a class="navbar-link" (click)="redirectTo('contact')">Contact</a>
        </div>
    </div>
</div>
<div class="navbar-mobile-container" *ngIf="showBurgerMenu">
    <!-- <app-iconologo *ngIf="showMobileNavbar"></app-iconologo> -->
    <div class="logo">
        <!-- <div class="">Aurélie Manier</div>
        <div class="">Avocat Droit</div> -->
    </div>
    <div class="burger-menu-container" *ngIf="showBurgerMenu" [ngClass]="{'opened': menuOpened}">
        <app-burger-menu (click)="onMenuClick()"></app-burger-menu>
    </div>
    <div class="menu-mobile-background" *ngIf="isMobile" [ngClass]="{'opened': menuOpened}"></div>
    <div class="menu-mobile" [ngClass]="{'opened': menuOpened}">
        <ul>
            <li>
                <a class="navbar-link" (click)="redirectTo('home')">Accueil</a>
            </li>
            <li>
                <a class="navbar-link" (click)="redirectTo('domains')">Domaines</a>
            </li>
            <li>
                <a class="navbar-link" (click)="redirectTo('posts')">Articles</a>
            </li>
            <li>
                <a class="navbar-link" (click)="redirectTo('contact')">Contact</a>
            </li>
        </ul>
    </div>
</div>
