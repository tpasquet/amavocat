<aside class="mobile-action-bar" *ngIf="visible" [attr.aria-label]="'a11y.quickContact' | translate">
    <a class="action action--call" href="tel:+33769997560" [attr.aria-label]="'cta.callLabel' | translate">
        <i class="bi bi-telephone" aria-hidden="true"></i>{{ 'mobileBar.call' | translate }}
    </a>
    <a class="action action--mail" [routerLink]="['/', language, 'contact']" fragment="message" [attr.aria-label]="'cta.messageLabel' | translate">
        <i class="bi bi-envelope" aria-hidden="true"></i>{{ 'mobileBar.message' | translate }}
    </a>
</aside>
