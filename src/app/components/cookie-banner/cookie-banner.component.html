<div class="cookie-banner" *ngIf="isVisible">
  <div class="cookie-banner__content">
    <div class="cookie-banner__text">
      <h3 class="cookie-banner__title">{{ 'cookieBanner.title' | translate }}</h3>
      <p class="cookie-banner__description">
        {{ 'cookieBanner.description' | translate }}
        <a routerLink="/privacy" class="cookie-banner__link">{{ 'cookieBanner.learnMore' | translate }}</a>
      </p>
    </div>
    <div class="cookie-banner__actions">
      <button 
        class="cookie-banner__btn cookie-banner__btn--reject" 
        (click)="rejectAll()"
        type="button">
        {{ 'cookieBanner.reject' | translate }}
      </button>
      <button 
        class="cookie-banner__btn cookie-banner__btn--accept" 
        (click)="acceptAll()"
        type="button">
        {{ 'cookieBanner.acceptAll' | translate }}
      </button>
    </div>
  </div>
</div>
