<form class="message-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2>Contacter Maitre Manier</h2>
    <div class="form-group w-100 mb-2">
        <label class="mb-2" for="firstName">Prénom*</label>
        <input class="form-control" type="text" id="firstName" formControlName="firstName" placeholder="Saisissez votre prénom">
    </div>
    <div class="form-group w-100 mb-2">
        <label class="mb-2" for="lastName">Nom*</label>
        <input class="form-control" type="text" id="lastName" formControlName="lastName" placeholder="Saisissez votre nom">
    </div>
    <div class="form-group w-100 mb-2">
        <label class="mb-2" for="phoneNumber">Téléphone*</label>
        <input class="form-control" type="tel" id="phoneNumber" formControlName="phoneNumber" placeholder="Saisissez votre numéro de téléphone">
    </div>
    <div class="form-group w-100 mb-2">
        <label class="mb-2" for="email">Email</label>
        <input class="form-control" type="email" id="email" formControlName="email" placeholder="Saisissez votre adresse email">
    </div>
    <div class="form-group w-100 mb-2">
        <label class="mb-2" for="inputMessage">Message*</label>
        <textarea class="form-control" id="inputMessage" placeholder="Saissez la raison de votre prise de contact"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Envoyer</button>
</form>
