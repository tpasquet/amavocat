<section class="contact-cta" aria-labelledby="contact-cta-title">
    <h2 id="contact-cta-title" class="contact-cta-title">{{ 'cta.title' | translate }}</h2>
    <p class="contact-cta-text">{{ 'cta.text' | translate }}</p>
    <div class="contact-cta-actions">
        <a class="cta-button cta-button--primary" href="tel:+33769997560" [attr.aria-label]="'cta.callLabel' | translate">
            <i class="bi bi-telephone" aria-hidden="true"></i> 07 69 99 75 60
        </a>
        <a class="cta-button cta-button--outline" href="mailto:contact@aureliemanier-avocat.fr">
            <i class="bi bi-envelope" aria-hidden="true"></i> {{ 'cta.email' | translate }}
        </a>
    </div>
</section>
