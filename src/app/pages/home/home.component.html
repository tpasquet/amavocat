<div class="page-container container-fluid">
    <main class="main-layout" id="main-content">
        <div class="content-wrapper">
            <h1 class="sr-only">{{ 'home.title' | translate }}</h1>
            <section class="bloc">
                <p class="intro-text" [innerHTML]="'home.intro' | translate"></p>
                <div class="hero-actions">
                    <a class="cta-button cta-button--primary" [routerLink]="['/', language, 'contact']">{{ 'home.cta.appointment' | translate }}</a>
                    <a class="cta-button cta-button--outline" [routerLink]="['/', language, 'domaines']">{{ 'home.cta.domains' | translate }}</a>
                </div>
                <img class="img-fluid profile-image mobile-only" 
                    src="../../../assets/img/profile-picture-home.jpg"
                    srcset="../../../assets/img/profile-picture-home-350w.jpg 350w,
                            ../../../assets/img/profile-picture-home-525w.jpg 525w,
                            ../../../assets/img/profile-picture-home.jpg 700w"
                    sizes="(max-width: 768px) 250px, 350px"
                    alt="Portrait de Maître Aurélie Manier">
            </section>

            <section class="bloc bloc-with-image">
                <img class="img-fluid profile-image desktop-only" 
                    src="../../../assets/img/profile-picture-home.jpg"
                    srcset="../../../assets/img/profile-picture-home-350w.jpg 350w,
                            ../../../assets/img/profile-picture-home-525w.jpg 525w,
                            ../../../assets/img/profile-picture-home.jpg 700w"
                    sizes="350px"
                    alt="Portrait de Maître Aurélie Manier">
                <h2 class="bloc-title big-underline">{{ 'home.expertise.title' | translate }}</h2>
                <p [innerHTML]="'home.expertise.description' | translate"></p>
                <ul>
                    <li [innerHTML]="'home.expertise.items.litigation' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.safety' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.harassment' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.inaptitude' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.accidents' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.trafficAccidents' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.diseases' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.disability' | translate"></li>
                    <li [innerHTML]="'home.expertise.items.organisms' | translate"></li>
                </ul>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'home.support.title' | translate }}</h2>
                <p [innerHTML]="'home.support.paragraph1' | translate"></p>
                <p [innerHTML]="'home.support.paragraph2' | translate"></p>
                <p [innerHTML]="'home.support.paragraph3' | translate"></p>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'home.consultations.title' | translate }}</h2>
                <p [innerHTML]="'home.consultations.description' | translate"></p>
                <ul>
                    <li [innerHTML]="'home.consultations.items.office' | translate"></li>
                    <li [innerHTML]="'home.consultations.items.video' | translate"></li>
                    <li [innerHTML]="'home.consultations.items.phone' | translate"></li>
                </ul>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'home.values.title' | translate }}</h2>
                <ul>
                    <li [innerHTML]="'home.values.items.simple' | translate"></li>
                    <li [innerHTML]="'home.values.items.amicable' | translate"></li>
                    <li [innerHTML]="'home.values.items.secret' | translate"></li>
                    <li [innerHTML]="'home.values.items.trust' | translate"></li>
                    <li [innerHTML]="'home.values.items.fees' | translate"></li>
                    <li [innerHTML]="'home.values.items.transparent' | translate"></li>
                </ul>
            </section>

            <app-contact-cta></app-contact-cta>
        </div>

    </main>
</div>
