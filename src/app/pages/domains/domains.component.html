<div class="page-container container-fluid">
    <main class="main-layout" id="main-content">
        <div class="content-wrapper">
            <section class="bloc d-flex flex-column flex-md-row align-items-start justify-content-between">
                <div>
                    <div>
                        <h1 class="page-title">{{ 'domains.title' | translate }}</h1>
                        <h2>{{ 'domains.subtitle' | translate }}</h2>
                    </div>
                    <div class="d-flex-row">
                        <p [innerHTML]="'domains.intro' | translate"></p>
                    </div>
                </div>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'domains.expertiseTitle' | translate }}</h2>
                <app-expertise-grid itemsKey="domains.expertiseItems"></app-expertise-grid>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'domains.supportTitle' | translate }}</h2>
                <p [innerHTML]="'domains.supportParagraph1' | translate"></p>
                <p [innerHTML]="'domains.supportParagraph2' | translate"></p>
            </section>

            <app-contact-cta></app-contact-cta>
        </div>
    </main>
</div>
