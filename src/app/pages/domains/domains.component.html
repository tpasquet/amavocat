<div class="page-container container-fluid">
    <main class="main-layout" id="main-content">
        <div class="content-wrapper">
            <section class="bloc d-flex flex-column flex-md-row align-items-start justify-content-between">
                <div>
                    <div>
                        <h1>{{ 'domains.title' | translate }}</h1>
                        <h2>{{ 'domains.subtitle' | translate }}</h2>
                    </div>
                    <div class="d-flex-row">
                        <p [innerHTML]="'domains.intro' | translate"></p>
                    </div>
                </div>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'domains.expertiseTitle' | translate }}</h2>
                <ul>
                    <li [innerHTML]="'domains.expertiseItems.litigation' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.safety' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.harassment' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.inaptitude' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.accidents' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.diseases' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.disability' | translate"></li>
                    <li [innerHTML]="'domains.expertiseItems.organisms' | translate"></li>
                </ul>
            </section>

            <section class="bloc">
                <h2 class="bloc-title big-underline">{{ 'domains.supportTitle' | translate }}</h2>
                <p [innerHTML]="'domains.supportParagraph1' | translate"></p>
                <p [innerHTML]="'domains.supportParagraph2' | translate"></p>
            </section>
        </div>
    </main>
</div>
