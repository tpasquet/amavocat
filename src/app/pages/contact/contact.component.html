<div class="page-container">
    <main class="contact-main" id="main-content">
        <section class="contact-header">
            <h1 class="contact-title">{{ 'contact.title' | translate }}</h1>
            <p class="contact-subtitle">{{ 'contact.subtitle' | translate }}</p>
        </section>

        <div class="contact-grid">
            <!-- Contact Information -->
            <section class="contact-info-section">
                <app-contact-summary></app-contact-summary>
            </section>

            <!-- Map Section -->
            <section class="contact-map-section">
                <div class="map-container">
                    <iframe
                        width="100%"
                        height="400"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        src="https://www.openstreetmap.org/export/embed.html?bbox=4.851%2C45.758%2C4.857%2C45.762&layer=mapnik&marker=45.760%2C4.854"
                        style="border: 1px solid #ccc; border-radius: 0;">
                    </iframe>
                    <small class="d-block mt-2">
                        <a href="https://www.openstreetmap.org/?mlat=45.760&mlon=4.854#map=17/45.760/4.854" target="_blank" rel="noopener noreferrer">Voir sur OpenStreetMap</a>
                    </small>
                </div>
            </section>
        </div>
    </main>
</div>
