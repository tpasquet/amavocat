<div class="page-container">
    <main class="contact-main" id="main-content">
        <section class="contact-header">
            <h1 class="contact-title page-title">{{ 'contact.title' | translate }}</h1>
            <p class="contact-subtitle">{{ 'contact.subtitle' | translate }}</p>
        </section>

        <div class="contact-grid">
            <!-- Contact Information -->
            <section class="contact-info-section">
                <app-contact-summary></app-contact-summary>
            </section>

            <!-- Map Section -->
            <section class="contact-map-section">
                <div class="map-container">
                    <iframe
                        [title]="'contact.mapTitle' | translate"
                        loading="lazy"
                        width="100%"
                        height="400"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        src="https://www.openstreetmap.org/export/embed.html?bbox=4.847%2C45.758%2C4.853%2C45.762&layer=mapnik&marker=45.7603%2C4.8501">
                    </iframe>
                    <small class="d-block mt-2">
                        <a href="https://www.openstreetmap.org/?mlat=45.7603&mlon=4.8501#map=17/45.7603/4.8501" target="_blank" rel="noopener noreferrer">{{ 'contact.openStreetMap' | translate }} <span class="sr-only">{{ 'a11y.newWindow' | translate }}</span></a>
                    </small>
                </div>
            </section>
        </div>
    </main>
</div>
