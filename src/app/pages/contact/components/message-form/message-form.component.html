<form class="w-100">
    <div class="form-group pb-4">
        <label for="inputName">Nom*</label>
        <input type="text" class="form-control" id="inputName" aria-describedby="inputName" placeholder="Saisissez votre nom et prénom">
    </div>
    <div class="form-group pb-4">
        <label for="inputPhone">Téléphone*</label>
        <input type="tel" class="form-control" id="inputPhone" aria-describedby="inputPhone" placeholder="Saisissez votre numéro de téléphone">
    </div>
    <div class="form-group pb-4">
        <label for="inputEmail">Email</label>
        <input type="email" class="form-control" id="inputEmail" aria-describedby="inputEmail" placeholder="Saisissez votre adresse email">
    </div>
    <div class="form-group pb-4">
        <label for="inputMessage">Message*</label>
        <textarea class="form-control" id="inputMessage" rows="3" placeholder="Saissez la raison de votre prise de contact"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Envoyer</button>
</form>
