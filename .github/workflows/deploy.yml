name: Déploiement Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:prod

      - name: Configurer la clé SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Envoyer le site sur Alwaysdata
        env:
          SSH_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_USER }}
          DEPLOY_PATH: ${{ secrets.ALWAYSDATA_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/amavocat-app/browser/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
