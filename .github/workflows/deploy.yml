name: Deploy to Alwaysdata

on:
  push:
    branches: [main]
    # The API and the admin app have their own workflow (api.yml)
    paths-ignore: ['api/**', 'projects/admin/**', '.github/workflows/api.yml']
  workflow_dispatch:
  # Sent by the API when published content changes or a scheduled article's date passes
  repository_dispatch:
    types: [content-changed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (with the articles published in the backoffice)
        env:
          # Unset: the site is built without articles. Set: the API must answer, or the build fails
          CONTENT_API_URL: ${{ vars.CONTENT_API_URL }}
        run: npm run build:prod

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSH_HOST: ${{ vars.ALWAYSDATA_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload site to Alwaysdata
        env:
          SSH_HOST: ${{ vars.ALWAYSDATA_HOST }}
          SSH_USER: ${{ vars.ALWAYSDATA_USER }}
          DEPLOY_PATH: ${{ vars.ALWAYSDATA_PATH }}
        run: |
          # rsync --delete must never target the account's home directory
          case "${DEPLOY_PATH%/}" in
            ""|"."|"~"|"/home/$SSH_USER"|"/home")
              echo "::error::ALWAYSDATA_PATH must point to the site folder, not '$DEPLOY_PATH'"
              exit 1
              ;;
          esac
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/amavocat-app/browser/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
